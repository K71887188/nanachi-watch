name: nanachi-watch

on:
  schedule:
    # Releases: daily 09:00 JST = 00:00 UTC
    - cron: "0 0 * * *"
    # Stocks: weekdays 16:30 JST = 07:30 UTC
    - cron: "30 7 * * 1-5"
    # Fund NAV: weekdays 22:30 JST = 13:30 UTC (NAV updates ~22:00 JST)
    - cron: "30 13 * * 1-5"
    # Weather: every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "releases | stocks | fund | weather | test"
        required: true
        default: "test"

permissions:
  contents: write

concurrency:
  group: nanachi-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decide mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 0 * * *" ]; then
            echo "mode=releases" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 7 * * 1-5" ]; then
            echo "mode=stocks" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 13 * * 1-5" ]; then
            echo "mode=fund" >> "$GITHUB_OUTPUT"
          else
            echo "mode=weather" >> "$GITHUB_OUTPUT"
          fi
      - name: Run watcher
        env:
          HOOK_TOKEN: ${{ secrets.HOOK_TOKEN }}
        run: python3 watch.py "${{ steps.mode.outputs.mode }}"
      - name: Commit state
        run: |
          git config user.name "nanachi-watch"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "state: ${{ steps.mode.outputs.mode }} check"
          git push
